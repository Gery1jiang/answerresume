# Nginx Gateway Configuration
# Single port serves: Admin SPA (/) + Flask visitor (/visitor/) + FastAPI API (/api/)
#
# Docker usage: docker-compose uses this for the gateway service
# Standalone usage: update upstream addresses to localhost

upstream backend {
    server backend:51666;
}

upstream visitor {
    server visitor:51667;
}

server {
    listen 80;
    server_name _;
    charset utf-8;
    client_max_body_size 50M;

    # Admin React SPA
    root /usr/share/nginx/html;
    index index.html;

    location / {
        try_files $uri $uri/ /index.html;
    }
    location = /index.html {
        add_header Cache-Control "no-cache, must-revalidate";
    }

    location /assets/ {
        expires 30d;
        add_header Cache-Control "public, immutable";
    }

    # Visitor Flask App
    location /visitor/ {
        proxy_pass http://visitor/;
        proxy_http_version 1.1;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
        proxy_buffering off;
        proxy_cache off;
        proxy_read_timeout 300s;
    }

    # FastAPI Backend
    location /api/ {
        proxy_pass http://backend;
        proxy_http_version 1.1;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
        proxy_buffering off;
        proxy_cache off;
        proxy_read_timeout 300s;
    }

    # Admin endpoints (legacy compatibility)
    location /admin/ {
        proxy_pass http://backend;
        proxy_http_version 1.1;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_buffering off;
        proxy_cache off;
        proxy_read_timeout 300s;
    }

    # Uploads
    location /uploads/ {
        alias /app/uploads/;
        expires 7d;
    }

    # Favicon
    location /favicon.svg {
        root /usr/share/nginx/html;
        expires 30d;
    }

    # Security
    add_header X-Content-Type-Options "nosniff" always;
    add_header X-Frame-Options "SAMEORIGIN" always;
    add_header X-XSS-Protection "1; mode=block" always;
}
