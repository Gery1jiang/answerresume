name: answerresume

services:
  rag-worker:
    image: answerresume-backend:latest
    command: uvicorn rag_worker.main:app --host 0.0.0.0 --port 51669
    volumes:
      - ./backend/data:/app/data
      - ./backend/user_data:/app/user_data
      - ./vector_store:/app/vector_store
      - hf_cache:/root/.cache
    env_file:
      - .env
    environment:
      - DATABASE_URL=postgresql://gery:answeragent2026@postgres:5432/answeragent
      - VISITOR_API_KEY=${DEEPSEEK_API_KEY}
      - ADMIN_API_KEY=${LONGCAT_API_KEY}
    depends_on:
      postgres:
        condition: service_healthy
    restart: unless-stopped

  crawler-worker:
    build:
      context: ./backend
      dockerfile: crawler_worker/Dockerfile
    volumes:
      - ./backend/crawler_worker:/app/crawler_worker
      - ./backend/services:/app/services
    env_file:
      - .env
    environment:
      - KIMI_DAEMON_URL=http://kimi-relay:10087/command
    restart: unless-stopped

  file-worker:
    build:
      context: ./backend
      dockerfile: file_worker/Dockerfile
    ports:
      - "51667:51667"
    volumes:
      - hf_cache:/root/.cache
      - ./backend/file_worker/main.py:/app/main.py
    env_file:
      - .env
    restart: unless-stopped

  postgres:
    image: postgres:16-alpine
    volumes:
      - postgres_data:/var/lib/postgresql/data
    environment:
      - POSTGRES_USER=gery
      - POSTGRES_PASSWORD=answeragent2026
      - POSTGRES_DB=answeragent
    restart: unless-stopped
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U gery -d answeragent"]
      interval: 5s
      timeout: 5s
      retries: 5

  backend:
    build:
      context: ./backend
      dockerfile: Dockerfile
    ports:
      - "51666:51666"
    volumes:
      - ./backend/data:/app/data
      - ./backend/knowledge:/app/knowledge
      - ./backend/user_data:/app/user_data
      - ./backend/resumes:/app/resumes
      - ./vector_store:/app/vector_store
      - ./backend/main.py:/app/main.py
      - ./backend/routers:/app/routers
      - ./backend/services:/app/services
      - ./backend/schemas:/app/schemas
      - hf_cache:/root/.cache
    env_file:
      - .env
    environment:
      - DATABASE_URL=postgresql://gery:answeragent2026@postgres:5432/answeragent
      - KIMI_DAEMON_URL=http://kimi-relay:10087/command
      - FILE_WORKER_URL=http://file-worker:51667
      - CRAWLER_WORKER_URL=http://crawler-worker:51668
      - RAG_WORKER_URL=http://rag-worker:51669
      - VISITOR_API_KEY=${DEEPSEEK_API_KEY}
      - ADMIN_API_KEY=${LONGCAT_API_KEY}
    depends_on:
      postgres:
        condition: service_healthy
      rag-worker:
        condition: service_started
      file-worker:
        condition: service_started
      crawler-worker:
        condition: service_started
    restart: unless-stopped

  visitor:
    build:
      context: ./frontend
      dockerfile: Dockerfile.visitor
    environment:
      - BACKEND_URL=http://backend:51666
    env_file:
      - .env
    depends_on:
      backend:
        condition: service_started
    restart: unless-stopped

  gateway:
    image: nginx:alpine
    ports:
      - "51668:80"
    volumes:
      - ./frontend/admin/dist:/usr/share/nginx/html:ro
      - ./deploy/nginx.conf:/etc/nginx/conf.d/default.conf:ro
    depends_on:
      backend:
        condition: service_started
      visitor:
        condition: service_started
    restart: unless-stopped

  kimi-relay:
    build:
      context: .
      dockerfile: Dockerfile.relay
    volumes:
      - ./relay_kimi.py:/relay_kimi.py
    ports:
      - "10087:10087"
    extra_hosts:
      - "host.docker.internal:host-gateway"
    environment:
      - KIMI_HOST=host.docker.internal
      - KIMI_PORT=10086
      - RELAY_PORT=10087
    restart: unless-stopped

  searxng:
    image: searxng/searxng:latest
    container_name: searxng
    volumes:
      - ../searxng/config:/etc/searxng:rw
    environment:
      - SEARXNG_BASE_URL=http://localhost:51669
    restart: unless-stopped

volumes:
  hf_cache:
  postgres_data:
